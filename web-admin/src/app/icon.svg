<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121814" />
      <stop offset="100%" stop-color="#060907" />
    </radialGradient>

    <!-- Metallic Gold Gradients for Cart & Stem -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Organic Green Leaf Gradients -->
    <linearGradient id="leafTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="40%" stop-color="#65a30d" />
      <stop offset="80%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>

    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="60%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#eab308" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Rounded Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)" />

  <g filter="url(#goldGlow)">
    <!-- 1. Gold Cart Body & Frame -->
    <!-- Handle & Main Frame Bar -->
    <path d="M 125 110 
             H 160 
             C 172 110, 180 118, 184 130 
             L 220 290 
             C 224 306, 238 318, 255 318 
             H 355 
             C 368 318, 376 308, 376 298 
             C 376 288, 368 278, 355 278 
             H 258 
             L 236 182 
             H 275 
             C 285 182, 290 174, 286 166 
             L 282 158 
             C 278 150, 268 144, 258 144 
             H 185" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Cart Basket Lower Arc / Support -->
    <path d="M 270 190 
             C 290 205, 312 235, 318 290" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="20" 
          stroke-linecap="round" />

    <!-- 2. Wheels -->
    <!-- Left Wheel -->
    <circle cx="228" cy="384" r="32" fill="none" stroke="url(#goldShine)" stroke-width="18" />
    <!-- Right Wheel -->
    <circle cx="324" cy="384" r="32" fill="none" stroke="url(#goldShine)" stroke-width="18" />

    <!-- 3. Golden Stem Sprouting From Basket -->
    <path d="M 305 315 
             C 305 285, 308 245, 320 205" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="15" 
          stroke-linecap="round" />
          
    <path d="M 306 285 
             C 290 265, 270 255, 245 245" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />
  </g>

  <!-- 4. Three Fresh Green Leaves -->
  <!-- A. Top Right Leaf (Largest) -->
  <g>
    <path d="M 318 215 
             C 320 150, 365 105, 420 85 
             C 425 145, 385 195, 318 215 Z" 
          fill="url(#leafTop)" />
    <!-- Center Vein -->
    <path d="M 318 215 C 355 170, 388 130, 420 85" 
          fill="none" stroke="#bef264" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- B. Left Middle Leaf -->
  <g>
    <path d="M 305 295 
             C 285 245, 240 215, 218 218 
             C 220 270, 260 300, 305 295 Z" 
          fill="url(#leafLeft)" />
    <!-- Center Vein -->
    <path d="M 305 295 C 275 265, 248 240, 218 218" 
          fill="none" stroke="#d9f99d" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- C. Bottom Right Leaf -->
  <g>
    <path d="M 316 280 
             C 325 245, 360 238, 390 252 
             C 382 285, 348 305, 316 280 Z" 
          fill="url(#leafRight)" />
    <!-- Center Vein -->
    <path d="M 316 280 C 342 265, 366 258, 390 252" 
          fill="none" stroke="#d9f99d" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
